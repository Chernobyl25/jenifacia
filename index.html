<html>
<head>
  <title>Memorama VR Pro - Con Joystick</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>body{margin:0; background: #000;}</style>
</head>
<body>
  <a-scene shadow="type: pcfsoft">
    
    <a-assets>
      <img id="back" src="img/back.jpeg">
      <img id="front1" src="img/front1.jpg"><img id="front2" src="img/front2.jpg">
      <img id="front3" src="img/front3.jpg"><img id="front4" src="img/front4.jpg">
      <img id="front5" src="img/front5.jpg"><img id="front6" src="img/front6.jpg">
      <img id="sky" src="https://cdn.aframe.io/360-guide/beach/conifer.jpg">

      <!-- AUDIO -->
      <audio id="audie" src="img/gabriela.mp3" preload="auto"></audio>
      <audio id="sndFlip" src="https://cdn.freesound.org/previews/240/240776_4107740-lq.mp3" preload="auto"></audio>
      <audio id="sndMatch" src="https://cdn.freesound.org/previews/270/270333_5123851-lq.mp3" preload="auto"></audio>
      <audio id="sndError" src="https://cdn.freesound.org/previews/142/142608_1840739-lq.mp3" preload="auto"></audio>
      <audio id="sndWin" src="https://cdn.freesound.org/previews/253/253172_4404552-lq.mp3" preload="auto"></audio>
    </a-assets>

    <!-- Sonidos -->
    <a-entity id="soundFlip" sound="src: #sndFlip"></a-entity>
    <a-entity id="soundMatch" sound="src: #sndMatch"></a-entity>
    <a-entity id="soundError" sound="src: #sndError"></a-entity>
    <a-entity id="soundWin" sound="src: #sndWin"></a-entity>

    <!-- Música de fondo -->
    <a-entity id="musicBg" sound="src: #audie; autoplay: true; loop: true; volume: 10"></a-entity>

    <a-sky src="#sky" rotation="0 -90 0"></a-sky>
    <a-light type="ambient" color="#FFF" intensity="0.7"></a-light>

    <!-- Rig de cámara -->
    <a-entity id="rig" position="0 0 5">
      <a-camera look-controls wasd-controls position="0 2.5 0" joystick-pointer>
        <a-entity cursor="fuse: true; fuseTimeout: 1200"
                  raycaster="objects: .clickable"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: #00ffff; shader: flat"
                  animation__fusing="property: scale; startEvents: fusing; dur: 1200; from: 1 1 1; to: 0.1 0.1 0.1"
                  animation__mouseleave="property: scale; startEvents: mouseleave; dur: 300; to: 1 1 1">
        </a-entity>
      </a-camera>
    </a-entity>

    <!-- Tablero -->
    <a-entity position="0 2.5 -0.5">
      <a-plane width="6.5" height="5.5" color="#111"></a-plane>
      
      <a-plane id="resetBtn" class="clickable" width="1.5" height="0.5" position="0 -2.2 0.1" color="#ff4d4d">
        <a-text value="REINICIAR" align="center" color="#FFF" width="4"></a-text>
      </a-plane>

      <a-text id="score" value="SCORE: 000" position="0 2.3 0.1" align="center" color="#ff00ff" width="8"></a-text>

      <a-entity id="card-container">
        <a-box class="card clickable" data-pair="1" depth="0.1" height="1.1" width="0.8" material="src: #back"></a-box>
        <a-box class="card clickable" data-pair="1" depth="0.1" height="1.1" width="0.8" material="src: #back"></a-box>
        <a-box class="card clickable" data-pair="2" depth="0.1" height="1.1" width="0.8" material="src: #back"></a-box>
        <a-box class="card clickable" data-pair="2" depth="0.1" height="1.1" width="0.8" material="src: #back"></a-box>
        <a-box class="card clickable" data-pair="3" depth="0.1" height="1.1" width="0.8" material="src: #back"></a-box>
        <a-box class="card clickable" data-pair="3" depth="0.1" height="1.1" width="0.8" material="src: #back"></a-box>
        <a-box class="card clickable" data-pair="4" depth="0.1" height="1.1" width="0.8" material="src: #back"></a-box>
        <a-box class="card clickable" data-pair="4" depth="0.1" height="1.1" width="0.8" material="src: #back"></a-box>
        <a-box class="card clickable" data-pair="5" depth="0.1" height="1.1" width="0.8" material="src: #back"></a-box>
        <a-box class="card clickable" data-pair="5" depth="0.1" height="1.1" width="0.8" material="src: #back"></a-box>
        <a-box class="card clickable" data-pair="6" depth="0.1" height="1.1" width="0.8" material="src: #back"></a-box>
        <a-box class="card clickable" data-pair="6" depth="0.1" height="1.1" width="0.8" material="src: #back"></a-box>
      </a-entity>
    </a-entity>

  </a-scene>

  <!-- Script del juego + joystick -->
  <script>
    const cards = Array.from(document.querySelectorAll('.card'));
    const scoreText = document.querySelector('#score');
    const resetBtn = document.querySelector('#resetBtn');
    
    const sFlip = document.querySelector('#soundFlip');
    const sMatch = document.querySelector('#soundMatch');
    const sError = document.querySelector('#soundError');
    const sWin = document.querySelector('#soundWin');

    let flipped = [];
    let lock = false;
    let score = 0;
    let matches = 0;
    let activeTimeouts = [];

    const fronts = { '1': '#front1', '2': '#front2', '3': '#front3', '4': '#front4', '5': '#front5', '6': '#front6' };

    const positions = [];
    for (let y = 1.3; y >= -1.3; y -= 1.3) {
      for (let x = -1.5; x <= 1.5; x += 1) {
        positions.push({x: x, y: y, z: 0.1});
      }
    }

    function playSnd(obj) {
        obj.components.sound.stopSound();
        obj.components.sound.playSound();
    }

    function shuffleGame() {
      activeTimeouts.forEach(t => clearTimeout(t));
      activeTimeouts = [];
      lock = false;
      flipped = [];
      score = 0;
      matches = 0;
      scoreText.setAttribute('value', 'SCORE: 000');

      const shuffledPos = [...positions].sort(() => Math.random() - 0.5);

      cards.forEach((card, i) => {
        card.removeAttribute('animation__rotate');
        card.setAttribute('position', shuffledPos[i]);
        card.setAttribute('rotation', '0 0 0');
        card.setAttribute('material', {src: '#back', color: '#FFF'});
        card.removeAttribute('flipped');
        card.classList.add('clickable');
      });
    }

    cards.forEach(card => {
      card.addEventListener('click', () => {

        if (lock || card.getAttribute('flipped')) return;

        playSnd(sFlip);

        card.setAttribute('animation__rotate', {
          property: 'rotation',
          to: '0 180 0',
          dur: 400
        });

        activeTimeouts.push(setTimeout(() => {
          card.setAttribute('material', 'src', fronts[card.dataset.pair]);
        }, 200));

        card.setAttribute('flipped', true);
        flipped.push(card);

        if (flipped.length === 2) {

          lock = true;
          const [first, second] = flipped;

          if (first.dataset.pair === second.dataset.pair) {

            activeTimeouts.push(setTimeout(() => {

                playSnd(sMatch);

                score += 10;
                matches++;

                scoreText.setAttribute('value', 'SCORE: ' + score.toString().padStart(3, '0'));

                if(matches === 6) {
                    playSnd(sWin);
                    scoreText.setAttribute('value', '¡GANASTE!');
                }

            }, 500));

            first.classList.remove('clickable');
            second.classList.remove('clickable');

            flipped = [];
            lock = false;

          } else {

            activeTimeouts.push(setTimeout(() => {

              playSnd(sError);

              [first, second].forEach(c => {

                c.setAttribute('animation__rotate', {
                  property: 'rotation',
                  to: '0 0 0',
                  dur: 400
                });

                activeTimeouts.push(setTimeout(() => {
                  c.setAttribute('material', 'src', '#back');
                  c.removeAttribute('flipped');
                }, 200));

              });

              flipped = [];
              lock = false;

            }, 1000));

          }

        }

      });
    });

    resetBtn.addEventListener('click', shuffleGame);
    window.onload = shuffleGame;

    // -------- JOYSTICK POINTER PARA META QUEST --------
    AFRAME.registerComponent('joystick-pointer', {
      schema: { speed: { type: 'number', default: 0.05 } },
      
      init: function () {
        this.selected = null;
        this.raycaster = new THREE.Raycaster();
        this.camera = this.el.object3D;
      },
      
      tick: function () {
        const gp = navigator.getGamepads()[0];
        if(!gp) return;

        const horiz = gp.axes[2] || 0;
        const vert = gp.axes[3] || 0;

        // Mover cámara/rig
        if(Math.abs(horiz)>0.1 || Math.abs(vert)>0.1){
          const dir = new THREE.Vector3(horiz, 0, -vert).multiplyScalar(this.data.speed);
          this.el.object3D.position.add(dir);
        }

        // Raycast hacia adelante
        this.raycaster.setFromCamera(new THREE.Vector2(0,0), this.camera);
        const intersects = this.raycaster.intersectObjects(
          Array.from(document.querySelectorAll('.card')).map(c => c.object3D), true
        );

        if(intersects.length > 0){
          if(this.selected && this.selected!==intersects[0].object.el){
            this.selected.setAttribute('material', 'color', '#FFF'); // quitar resalte
          }
          this.selected = intersects[0].object.el;
          this.selected.setAttribute('material', 'color', '#ffff00'); // resaltar
        } else if(this.selected){
          this.selected.setAttribute('material', 'color', '#FFF');
          this.selected = null;
        }

        // Botón A (0) para click
        if(gp.buttons[0].pressed && this.selected){
          this.selected.emit('click');
        }
      }
    });
  </script>
</body>
</html>
